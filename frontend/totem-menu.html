<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantina - Fazer Pedido</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top-header">
    <div class="logo-text">Cantina Escolar</div>
    <div style="font-weight: 600; color: var(--text-dark);">
      Olá, <span id="displayClienteNome" class="text-red"></span>!
    </div>
  </header>

  <div class="totem-layout" style="height: calc(100vh - 76px);">
    <main class="totem-main">
      
      <!-- Área do Menu Principal -->
      <div class="totem-menu-area">
        <div class="categories-bar" id="categoriesContainer">
          <button class="category-btn active" data-categoria="Todos">Todos</button>
          <button class="category-btn" data-categoria="Salgados">Salgados</button>
          <button class="category-btn" data-categoria="Bebidas">Bebidas</button>
          <button class="category-btn" data-categoria="Saudáveis">Saudáveis</button>
          <button class="category-btn" data-categoria="Doces">Doces</button>
        </div>

        <div class="product-grid" id="productGrid">
          <!-- Produtos serão renderizados aqui pelo JS -->
        </div>
      </div>

      <!-- Carrinho / Bandeja Lateral -->
      <aside class="totem-cart-area">
        <div class="cart-header">
          <h2>Sua Bandeja 🛒</h2>
        </div>
        
        <div class="cart-items" id="cartItemsContainer">
          <!-- Itens do carrinho aqui -->
          <div style="text-align: center; color: var(--text-muted); margin-top: 40px;">
            Sua bandeja está vazia.<br>Adicione itens do cardápio!
          </div>
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span class="text-red" id="cartTotalValue">R$ 0,00</span>
          </div>
          <button class="btn btn-primary btn-checkout" id="btnFinalizarPedido">
            Finalizar Pedido
          </button>
        </div>
      </aside>

    </main>
  </div>

  <div id="toast-container"></div>
  
  <script src="js/api.js"></script>
  <script src="js/totem.js"></script>
</body>
</html>
