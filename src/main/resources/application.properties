spring.application.name=projetoCantina

# Porta da aplicação
server.port=8080

# URL com o parâmetro 'createDatabaseIfNotExist=true' para criar o banco automaticamente se não existir
spring.datasource.url=jdbc:mysql://localhost:3306/projeto_cantina?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC

# Suas credenciais (mantendo a boa prática da variável de ambiente que vimos antes)
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:sua_senha_padrao}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate/JPA para criar/atualizar as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
