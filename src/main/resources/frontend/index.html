<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantina Escolar - Seleção de Acesso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="full-screen-center">
    <div class="card" style="max-width: 600px; width: 100%; text-align: center; padding: 48px;">

      <h1 style="font-size: 2.5rem; margin-bottom: 8px; color: var(--primary-red);">Cantina Escolar</h1>
      <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 1.2rem;">Escolha como deseja acessar o sistema
      </p>

      <div style="display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;">

        <a href="totem-login.html" class="card"
          style="flex: 1; min-width: 200px; cursor: pointer; text-decoration: none; border: 2px solid transparent; transition: border-color 0.2s;">
          <h2 style="font-size: 1.5rem; color: var(--text-dark); margin-bottom: 8px;">Totem Aluno</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Autoatendimento para clientes</p>
        </a>

        <a href="admin-login.html" class="card"
          style="flex: 1; min-width: 200px; cursor: pointer; text-decoration: none; border: 2px solid transparent; transition: border-color 0.2s; background-color: var(--light-blue);">
          <h2 style="font-size: 1.5rem; color: var(--text-dark); margin-bottom: 8px;">Painel Admin</h2>
          <p style="color: var(--text-dark); font-size: 0.9rem; opacity: 0.8;">Gestão e Frente de Caixa</p>
        </a>

      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

</body>

</html>
