<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cantina Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="split-layout">
    <div class="split-image-area">
      <svg class="image-placeholder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>

    <div class="split-content">
        <div class="card hover-darken" style="max-width: 500px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="color: var(--primary-red); margin-bottom: 16px; display: flex; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <line x1="19" y1="8" x2="19" y2="14"></line>
                        <line x1="22" y1="11" x2="16" y2="11"></line>
                    </svg>
                </div>
                <h1 style="text-align: center; color: var(--primary-red); margin-bottom: 8px;">Criar Conta</h1>
                <p style="text-align: center; color: var(--text-muted);">Cadastre o acesso de operador ou admin da cantina</p>
            </div>

            <form id="cadastroForm">
                <div class="input-group">
                    <label for="login">Login de Usuário</label>
                    <input type="text" id="login" name="login" required placeholder="Digite o login de acesso" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="4" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <label for="tipoUsuario">Perfil de Acesso</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="OPERADOR" selected>Operador de Caixa</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>

                <button type="submit" id="btnCadastrar" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
                    Cadastrar
                </button>
            </form>
            <div style="text-align: center; margin-top: 32px;">
                <a href="index.html" style="color: var(--text-muted); font-size: 0.95rem; text-decoration: underline;">Voltar para o Início</a>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script>
    const form = document.getElementById('cadastroForm');
    const btn = document.getElementById('btnCadastrar');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const login = document.getElementById('login').value.trim();
        const senha = document.getElementById('senha').value;
        const perfil = document.getElementById('tipoUsuario').value;

        btn.disabled = true;
        btn.textContent = 'Cadastrando...';

        try {
            const data = await window.apiFetch('/auth/cadastro', {
                method: 'POST',
                body: JSON.stringify({ login, senha, perfil })
            });

            if (data && data.sucesso) {
                window.showToast('Conta criada com sucesso! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.href = 'admin-login.html';
                }, 1500);
            }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = 'Cadastrar';
        }
    });
</script>
</body>
</html>
