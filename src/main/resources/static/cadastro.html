<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cantina Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="split-layout">
    <div class="split-image-area">
      <svg class="image-placeholder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>

    <div class="split-content">
        <div class="card hover-darken" style="max-width: 500px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="color: var(--primary-red); margin-bottom: 16px; display: flex; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <line x1="19" y1="8" x2="19" y2="14"></line>
                        <line x1="22" y1="11" x2="16" y2="11"></line>
                    </svg>
                </div>
                <h1 style="text-align: center; color: var(--primary-red); margin-bottom: 8px;">Criar Conta</h1>
                <p style="text-align: center; color: var(--text-muted);">Preencha os dados abaixo para se cadastrar</p>
            </div>

            <form id="cadastroForm">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="input-group">
                    <label for="tipoUsuario">Tipo de Usuário</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="" disabled selected>Selecione um perfil...</option>
                        <option value="ALUNO">Aluno</option>
                        <option value="PROFESSOR">Professor</option>
                        <option value="FUNCIONARIO_GERAL">Funcionário</option>
                        <option value="ADMINISTRADOR_CANTINA">Administrador da Cantina</option>
                    </select>
                </div>

                <div class="input-group d-none" id="matriculaGroup">
                    <label for="matricula">Matrícula (obrigatório para alunos)</label>
                    <input type="text" id="matricula" name="matricula" placeholder="Ex: 12345678">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
                    Cadastrar
                </button>
            </form>
            <div style="text-align: center; margin-top: 32px;">
                <a href="index.html" style="color: var(--text-muted); font-size: 0.95rem; text-decoration: underline; transition: color 0.2s;" onmouseover="this.style.color='var(--text-dark)'" onmouseout="this.style.color='var(--text-muted)'">Voltar para o Início</a>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    const form = document.getElementById('cadastroForm');
    const tipoUsuarioSelect = document.getElementById('tipoUsuario');
    const matriculaGroup = document.getElementById('matriculaGroup');
    const matriculaInput = document.getElementById('matricula');

    // Dinamismo do formulário: mostrar/esconder matrícula
    tipoUsuarioSelect.addEventListener('change', function() {
        if (this.value === 'ALUNO') {
            matriculaGroup.classList.remove('d-none');
            matriculaInput.setAttribute('required', 'required');
        } else {
            matriculaGroup.classList.add('d-none');
            matriculaInput.removeAttribute('required');
            matriculaInput.value = '';
        }
    });

    // Submissão do formulário
    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            tipoUsuario: document.getElementById('tipoUsuario').value,
            matricula: document.getElementById('matricula').value || null
        };

        try {
            const response = await fetch('/api/usuarios/cadastro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast('Cadastro realizado com sucesso!', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                const errorData = await response.json().catch(() => ({}));
                showToast(errorData.message || 'Erro ao realizar cadastro.', 'error');
            }
        } catch (error) {
            console.error(error);
            showToast('Erro de conexão ao tentar cadastrar.', 'error');
        }
    });

    // Função de Toast reutilizada (ou implementada baseada no CSS existente)
    function showToast(message, type) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = type === 'success' ? 
            `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #38A169"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>` : 
            `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-red)"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
        
        toast.innerHTML = `<span style="display: flex; align-items: center;">${icon}</span> <span>${message}</span>`;
        
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.animation = 'slideOut 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }
</script>

</body>
</html>
