<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantina - Autoatendimento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="full-screen-center">
    <div class="card" style="max-width: 500px; width: 100%; padding: 40px;">
      <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="color: var(--primary-red); font-size: 2.5rem; margin-bottom: 8px;">Bem-vindo!</h1>
        <p style="color: var(--text-muted);">Por favor, identifique-se para iniciar o pedido.</p>
      </div>

      <form id="totemLoginForm">
        <div class="input-group">
          <label for="nomeAluno">Qual é o seu nome?</label>
          <input type="text" id="nomeAluno" placeholder="Ex: João Silva" required autocomplete="name">
        </div>

        <div class="input-group">
          <label for="matriculaAluno">Número da Matrícula</label>
          <input type="text" id="matriculaAluno" placeholder="Ex: 123456" required>
        </div>

        <button type="submit" id="btnIniciarPedido" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.2rem; margin-top: 16px;">
          Começar meu pedido 🍔
        </button>
      </form>
      
      <div style="text-align: center; margin-top: 24px;">
        <a href="index.html" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: underline;">Voltar para o início</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script>
  document.getElementById('totemLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const matricula = document.getElementById('matriculaAluno').value.trim();
    const btn = document.getElementById('btnIniciarPedido');

    btn.disabled = true;
    btn.textContent = 'Validando matrícula...';

    try {
      const cliente = await window.apiFetch(`/api/clientes/matricula/${matricula}`);
      if (cliente && cliente.encontrado) {
        localStorage.setItem('cliente_id', cliente.id);
        localStorage.setItem('cliente_nome', cliente.nome);
        localStorage.setItem('cliente_matricula', cliente.matricula);
        
        window.showToast(`Bem-vindo(a), ${cliente.nome}!`, 'success');
        setTimeout(() => window.location.href = 'totem-menu.html', 800);
      }
    } catch (err) {
      // Se não encontrar no banco, usa o nome digitado como fallback
      const nomeManual = document.getElementById('nomeAluno').value.trim() || 'Aluno';
      localStorage.setItem('cliente_id', 1);
      localStorage.setItem('cliente_nome', nomeManual);
      localStorage.setItem('cliente_matricula', matricula);
      
      window.showToast(`Modo visitante: Bem-vindo(a), ${nomeManual}!`, 'info');
      setTimeout(() => window.location.href = 'totem-menu.html', 800);
    }
  });
</script>
</body>
</html>
